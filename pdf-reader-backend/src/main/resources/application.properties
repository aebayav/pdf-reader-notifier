spring.application.name=backend
# Veritabanı bağlantı adresi (srms_db yerine kendi database adını yaz)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Tek bir dosya için maksimum limit (Örn: 10MB)
spring.servlet.multipart.max-file-size=15MB

# Tek bir istekteki toplam veri limiti (Örn: 10MB)
spring.servlet.multipart.max-request-size=15MB

# Tesseract OCR Ayarları
app.ocr.executable=C:\\Program Files\\Tesseract-OCR\\tesseract.exe
# tessdata_best modelleri (Türkçe aksan doğruluğu için Program Files yerine kullanıcı dizini)
app.ocr.datapath=C:\\Users\\abaya\\tesseract-data\\tessdata
# Önce saf Türkçe model denenir; düşük kalite/başarısızlıkta yedek dil devreye girer
app.ocr.primary-language=tur
app.ocr.fallback-language=tur+eng
# Aksan işaretleri için 300 DPI + gri tonlama ile OCR yapılır
app.ocr.dpi=300

# Gemini (Google AI) ayarları - metin anlamlandırma için
app.gemini.api-key=
app.gemini.model=gemini-3.6-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
