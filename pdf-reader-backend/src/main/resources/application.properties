spring.application.name=backend
# Veritabanı bağlantı adresi (srms_db yerine kendi database adını yaz)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Tek bir dosya için maksimum limit (Örn: 10MB)
spring.servlet.multipart.max-file-size=15MB

# Tek bir istekteki toplam veri limiti (Örn: 10MB)
spring.servlet.multipart.max-request-size=15MB

# Tesseract OCR Ayarları
app.ocr.executable=C:\\Program Files\\Tesseract-OCR\\tesseract.exe
# tessdata_best modelleri (Türkçe aksan doğruluğu için Program Files yerine kullanıcı dizini)
app.ocr.datapath=C:\\Users\\abaya\\tesseract-data\\tessdata
# Önce saf Türkçe model denenir; düşük kalite/başarısızlıkta yedek dil devreye girer
app.ocr.primary-language=tur
app.ocr.fallback-language=tur+eng
# Aksan işaretleri için 300 DPI + gri tonlama ile OCR yapılır
app.ocr.dpi=300

# Uygulama konfigurasyonu - .env dosyasi baslatma yonteminden bagimsiz yuklenir
# (IntelliJ / mvnw / run-backend.cmd hepsinde calisir)
spring.config.import=optional:file:./.env,optional:file:../.env

# Gemini (Google AI) ayarları - metin anlamlandırma için
# API key GEMINI_API_KEY ortam degiskeninden gelir (kok dizindeki .env dosyasi)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.6-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# Notifier: gunluk kontrol cron'u ve kac gun onceden uyarilacagi
app.notifier.cron=0 0 9 * * *
app.notifier.days-ahead=7

# CORS: tum localhost portlari varsayilan olarak acik (CorsConfig);
# ek origin gerekiyorsa buraya virgulle ayrilmis liste ekle (orn. LAN IP)
app.cors.allowed-origins=

# Auth: token gecerlilik suresi (gun)
app.auth.token-ttl-days=30

# E-posta bildirimi acik/kapali + gonderen/alici
# SMTP sunucusu/kullanici/parola EmailService tarafindan MAIL_HOST,
# MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD ortam degiskenlerinden (.env) okunur
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
app.mail.to=${MAIL_TO:}
