spring.application.name=backend
# Veritabanı bağlantı adresi (srms_db yerine kendi database adını yaz)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Tek bir dosya için maksimum limit (Örn: 10MB)
spring.servlet.multipart.max-file-size=15MB

# Tek bir istekteki toplam veri limiti (Örn: 10MB)
spring.servlet.multipart.max-request-size=15MB

app.ocr.executable=C:\\Program Files\\Tesseract-OCR\\tesseract.exe
app.ocr.datapath=C:\\Program Files\\Tesseract-OCR\\tessdata
app.ocr.language=tur+eng
